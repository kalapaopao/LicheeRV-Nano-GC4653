# 仅支持顶层 key: value 标量；不要使用嵌套、列表、引号或行尾注释。
# 由 run_capture_first.sh 在接触摄像头前校验。1024 表示 1 倍增益。
schema_version: 1
camera_mode: 80
max_run_sec: 20
auto_record: false
jpeg_quality: 85

# C++ YOLO26n NPU实验：只修改此处，无需在启动命令附带参数。
npu_model_path: /code/camera/modules/record80_opt/fly_rm320_new_vpss_nv21_f16.cvimodel
# 20ms≈40 VPSS帧/秒；0=每个VI帧预处理（约80fps）；NPU约31.6次前向/秒。
vpss_min_gap_ms: 20

# auto: 保留 ISP 自动曝光；非零 max 值限制 AE 上限。
# manual: 固定曝光和三种增益。
exposure_mode: manual
auto_exposure_max_us: 3000
auto_analog_gain_max_x1024: 0
auto_digital_gain_max_x1024: 0
auto_isp_gain_max_x1024: 0
manual_exposure_us: 3500
manual_analog_gain_x1024: 1024
manual_digital_gain_x1024: 1024
manual_isp_gain_x1024: 1024

# default: 保留原ISP/PQ黑电平；manual: 使用下列RAW12域偏移。
# 黑电平手动值沿用现有实验配置；不同曝光和光照仍需复核。
black_level_mode: manual
black_level_r: 256
black_level_gr: 256
black_level_gb: 256
black_level_b: 256
